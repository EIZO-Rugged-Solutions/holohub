---
app:
  model_path: /workspace/holohub/data/models/Qwen/Qwen2.5-VL-3B-Instruct
  prompt: Describe the scene, the actions taking place, and any safety-relevant observations in this video.
  system_prompt: You are a helpful video understanding assistant.
  sample_video_path: /workspace/holohub/data/qwen2_5_vl_3b_local/av_construction_stop_timestamped.mp4
  query_interval_sec: 10.0
  max_tokens: 24
  temperature: 0.0
  tensor_dtype: float16
  quantization: none
  attn_implementation: sdpa

replayer_source:
  basename: av_construction_stop_timestamped
  frame_rate: 0
  repeat: true
  realtime: true
  count: 0

holoviz:
  width: 1280
  height: 752
  window_title: Qwen2.5-VL-3B Live
  headless: false
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0
